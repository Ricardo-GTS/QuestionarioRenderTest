# Blueprint do Render -- BUILD DE TESTE (branch render-test, repositorio QuestionarioRenderTest).
# Plano gratuito: 512 MB de RAM, entao sem Ollama (EMBEDDINGS_DISABLED: toda questao e'
# aceita, sem checagem de parecidas) e sem SMTP (codigos de e-mail aparecem nos Logs).
databases:
  - name: questionario-db
    plan: free
    databaseName: questionario
    user: questionario
    postgresMajorVersion: "16"

services:
  - type: web
    name: questionario
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DJANGO_DATABASE_URL
        fromDatabase:
          name: questionario-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DJANGO_BEHIND_HTTPS_PROXY
        value: "true"
      - key: EMBEDDINGS_DISABLED
        value: "true"
      - key: GUNICORN_WORKERS
        value: "2"
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: ADMIN_EMAILS
        sync: false
      # Codigos de confirmacao saem no console: sem buffer, aparecem na hora nos Logs.
      - key: PYTHONUNBUFFERED
        value: "1"
