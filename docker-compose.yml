services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # -1 = nunca descarregar o modelo da memoria (padrao do Ollama e' 5 min ocioso,
      # e recarregar o bge-m3 leva ~12 s na 1a pergunta criada depois disso). Custa
      # ~1,2 GB de RAM ocupados o tempo todo.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${OLLAMA_EMBED_MODEL}"]
    restart: "no"

  # Caixa de entrada falsa pra dev: interface em http://localhost:8025, SMTP interno
  # em mailpit:1025 (EMAIL_HOST=mailpit no .env). Em producao, usar o SMTP real (Gmail).
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"

  django:
    build: ./questionario_django
    restart: unless-stopped
    env_file: .env
    volumes:
      # Planilhas de backup das questoes (uma por semestre): ficam no servidor, fora do
      # container, pra nao sumirem ao recriar a imagem. Tem e-mails de alunos -> fora do git.
      - ./planilhas:/app/planilhas
    environment:
      DJANGO_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
  ollama_data:
