{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Questionario{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'core/css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/base.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/components.css' %}">
  <script src="{% static 'core/js/htmx.min.js' %}" defer></script>
  <script src="{% static 'core/js/htmx-csrf.js' %}" defer></script>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% include "core/_navbar.html" %}
  <main class="container">
    {% if messages %}
      {% for message in messages %}
        <p class="chip chip--{{ message.tags|default:'accent' }}">{{ message }}</p>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
