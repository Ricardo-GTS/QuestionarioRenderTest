<tr id="user-{{ u.id }}">
  <td data-label="Aluno"><strong>{{ u.name }}</strong>{% if u.is_admin %} <span class="tag tag--review">admin</span>{% endif %}<br><small>{{ u.email }}</small></td>
  <td data-label="Matrícula">
    <form class="rename-form" method="post" action="{% url 'accounts:admin_update_registration_number' u.id %}"
          hx-post="{% url 'accounts:admin_update_registration_number' u.id %}" hx-target="#user-{{ u.id }}" hx-swap="outerHTML">
      {% csrf_token %}
      <input type="text" name="registration_number" value="{{ u.registration_number|default:'' }}" aria-label="Matrícula de {{ u.name }}"
             inputmode="numeric" pattern="\d{8,12}" minlength="8" maxlength="12" required placeholder="não informada">
      <button type="submit" class="btn btn-small">Salvar</button>
    </form>
    {% if error %}<p class="errorlist"><span>{{ error }}</span></p>{% endif %}
  </td>
  <td class="num" data-label="Questões">{{ u.question_count }}</td>
  <td class="num" data-label="Reportes aceitos">{{ u.accepted_reports_count }}</td>
  <td class="num" data-label="Rejeitados">{{ u.rejected_reports_count }}</td>
  <td class="num" data-label="Questões removidas">{{ u.questions_removed_count }}</td>
  <td>
    {% if u.id != user.id %}
    <form method="post" action="{% url 'accounts:admin_delete_user' u.id %}" hx-post="{% url 'accounts:admin_delete_user' u.id %}"
          hx-confirm="Excluir o usuário {{ u.email }} e tudo o que essa conta criou em todos os semestres?" hx-target="#user-{{ u.id }}" hx-swap="outerHTML">
      {% csrf_token %}
      <button type="submit" class="btn btn-small btn-danger">Excluir</button>
    </form>
    {% endif %}
  </td>
</tr>
