<html lang="pt-br">

    <tr><td style="padding:24px 28px;">

      <p style="margin:0 0 12px;">{{ intro }}</p>
      <p style="margin:20px 0; font-size:30px; font-weight:bold; letter-spacing:8px; font-family: 'Courier New', monospace;"><span style="background:#FFE45C; padding:4px 10px; border-radius:4px; color:#1E2942;">{{ code }}</span></p>
