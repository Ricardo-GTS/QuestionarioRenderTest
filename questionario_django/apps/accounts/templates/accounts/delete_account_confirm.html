{% extends "core/base.html" %}
{% block title %}Confirmar exclusao - Questionario{% endblock %}
{% block content %}
<h1>Confirmar exclusao de conta</h1>
<div class="card">
  <p>Tem certeza que deseja excluir sua conta? Essa acao nao pode ser desfeita.</p>
  <form method="post" action="{% url 'accounts:delete_account' %}">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sim, excluir minha conta</button>
    <a href="{% url 'accounts:account' %}" class="btn">Cancelar</a>
  </form>
</div>
{% endblock %}
