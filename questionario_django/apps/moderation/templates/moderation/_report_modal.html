<div id="report-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="report-modal-title">
  <div class="surface">
    {% if sent %}
      <div class="notice notice--success"><p>Reporte enviado. Obrigado! O professor vai analisar.</p></div>
      <div class="actions"><button type="button" class="btn" hx-get="{% url 'moderation:close_report_modal' %}" hx-target="#report-modal" hx-swap="outerHTML">Fechar</button></div>
    {% else %}
      <h2 id="report-modal-title">Reportar pergunta</h2>
      <p class="muted">{{ question.statement }}</p>
      <form hx-post="{% url 'moderation:report_question' question.id %}" hx-target="#report-modal" hx-swap="outerHTML">
        {% csrf_token %}
        {% include "moderation/_report_form_fields.html" %}
        <div class="actions">
          <button type="submit" class="btn btn-primary">Enviar reporte</button>
          <button type="button" class="btn btn-ghost" hx-get="{% url 'moderation:close_report_modal' %}" hx-target="#report-modal" hx-swap="outerHTML">Cancelar</button>
        </div>
      </form>
    {% endif %}
  </div>
</div>
