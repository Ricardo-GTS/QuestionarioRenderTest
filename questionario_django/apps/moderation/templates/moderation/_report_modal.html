<div id="report-modal" style="position:fixed;inset:0;background:rgba(22,36,28,0.5);display:flex;align-items:center;justify-content:center;padding:1em;z-index:10;">
  <div class="card" style="max-width:420px;background:white;">
    {% if sent %}
      <p class="chip chip--true">Reporte enviado. Obrigado!</p>
      <button type="button" class="btn" hx-get="{% url 'moderation:close_report_modal' %}" hx-target="#report-modal" hx-swap="outerHTML">Fechar</button>
    {% else %}
      <h2>Reportar pergunta</h2>
      <p>{{ question.statement }}</p>
      <form hx-post="{% url 'moderation:report_question' question.id %}" hx-target="#report-modal" hx-swap="outerHTML">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <p>
          <label>{{ form.reason_category.label }}</label>
          {{ form.reason_category }}
          {{ form.reason_category.errors }}
        </p>
        <p>
          <label>{{ form.reason.label }}</label>
          {{ form.reason }}
          <small>{{ form.reason.help_text }}</small>
          {{ form.reason.errors }}
        </p>
        <button type="submit" class="btn btn-primary">Enviar reporte</button>
        <button type="button" class="btn" hx-get="{% url 'moderation:close_report_modal' %}" hx-target="#report-modal" hx-swap="outerHTML">Cancelar</button>
      </form>
    {% endif %}
  </div>
</div>
