<div class="card" id="question-{{ question.id }}">
  <p><strong>{{ question.statement }}</strong></p>
  <p>Autor: {{ question.author.name }} · Resposta: {% if question.correct_answer %}Verdadeiro{% else %}Falso{% endif %}
    {% if question.category %}· Categoria: {{ question.category }}{% endif %}
  </p>
  <button type="button" class="btn" hx-get="{% url 'moderation:edit_question' question.id %}" hx-target="#question-{{ question.id }}" hx-swap="outerHTML">Editar</button>
  <form style="display:inline" hx-post="{% url 'moderation:reactivate_question' question.id %}" hx-target="#question-{{ question.id }}" hx-swap="outerHTML">
    {% csrf_token %}
    <button type="submit" class="btn btn-primary">Reativar</button>
  </form>
</div>
